<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142329">
  <meta name="description" content="A simple mixed reality loading guide. Glance at the current item and move through the loading sequence.">
  <title>LoadXR</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./xr.css?v=2">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
  <script type="module" src="./xr-app.js?v=2"></script>
</head>
<body>
  <video id="camera-feed" autoplay muted playsinline aria-hidden="true" hidden></video>
  <header class="page-header"><button id="enter-xr" disabled>Checking mixed reality…</button></header>
  <main>
    <div class="preview-note"><span class="status-dot"></span><p id="xr-status" role="status">Preparing the loading guide…</p></div>
    <section class="glance-card" aria-label="Current loading item">
      <div class="plan-view"><div id="scene" role="img" aria-label="Current item close-up"><p>Preparing the item…</p></div><span id="counter" class="counter">— / —</span></div>
      <div id="item-information" class="item-information" aria-live="polite" aria-atomic="true">
        <h1 id="item-label">Loading…</h1><p id="item-detail"></p>
      </div>
      <nav class="sequence-controls" aria-label="Item load sequence"><button id="previous" disabled><span aria-hidden="true">←</span> Previous</button><button id="next" disabled>Next <span aria-hidden="true">→</span></button></nav>
    </section>
  </main>
  <noscript>This loading guide needs JavaScript enabled.</noscript>
</body>
</html>
